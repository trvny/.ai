#:schema https://developers.openai.com/codex/config-schema.json

# Repository defaults only. Keep model choice, UI preferences, credentials, and
# personal permissions in the user's Codex configuration.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"
project_doc_max_bytes = 32768
project_doc_fallback_filenames = []

[agents]
enabled = true
max_concurrent_threads_per_session = 4
interrupt_message = true

[sandbox_workspace_write]
writable_roots = []
network_access = false
exclude_tmpdir_env_var = false
exclude_slash_tmp = false

# Pass a small environment to child processes and strip likely credentials.
[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false
set = {}
experimental_use_profile = false

# Canonical pattern table. Codex treats the legacy exclude/include_only arrays
# as regular expressions; keep the patterns explicit and valid here instead.
[shell_environment_policy.filters]
".*(KEY|SECRET|TOKEN).*" = "exclude"
"^(ANTHROPIC|AZURE|CLOUDFLARE|GITHUB|OPENAI)_.*" = "exclude"

[analytics]
enabled = false

[otel]
log_user_prompt = false
exporter = "none"
trace_exporter = "none"
metrics_exporter = "none"
