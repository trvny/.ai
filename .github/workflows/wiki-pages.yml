name: Wiki Pages

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - ".github/workflows/wiki-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wiki/package-lock.json
      - run: npm --prefix wiki ci --no-audit --no-fund
      - run: npm --prefix wiki run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: wiki/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy wiki
        id: deployment
        uses: actions/deploy-pages@v4
