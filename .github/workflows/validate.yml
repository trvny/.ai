name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Check files and overlay behavior
        run: |
          python -m compileall -q tools
          python -m py_compile templates/openai-agent.py
          python tools/merge_profile.py \
            profiles/default.yaml \
            examples/profile.overlay.yaml \
            --schema schema/style-profile.schema.json \
            --output /tmp/profile.yaml
          python tools/render_profile.py \
            profiles/default.yaml \
            examples/profile.overlay.yaml \
            --schema schema/style-profile.schema.json \
            --output /tmp/instructions.txt
          python -m tools.render_profile \
            profiles/default.yaml \
            examples/profile.overlay.yaml \
            --schema schema/style-profile.schema.json \
            --output /tmp/instructions-module.txt
          cmp /tmp/instructions.txt /tmp/instructions-module.txt
          grep -q "Odpowiadaj w języku użytkownika" /tmp/instructions.txt
          grep -q "Najpierw podaj odpowiedź" /tmp/instructions.txt
          grep -q "pełnej walidacji" /tmp/instructions.txt
          printf 'personality:\n' > /tmp/bad-overlay.yaml
          if python tools/render_profile.py profiles/default.yaml /tmp/bad-overlay.yaml >/tmp/bad.out 2>/tmp/bad.err; then
            echo "expected null personality overlay to fail" >&2
            exit 1
          fi
          grep -q "personality.*must be a mapping" /tmp/bad.err
          python - <<'PY'
          import json
          import tomllib
          import zipfile

          import yaml

          from tools.render_profile import render

          with open("/tmp/profile.yaml", encoding="utf-8") as f:
              profile = yaml.safe_load(f)

          assert profile["id"] == "my-private-profile"
          assert profile["locale"] == "pl-PL"
          assert profile["personality"]["base"] == "friendly"
          assert profile["personality"]["modifiers"]["concise"] == 2
          assert profile["personality"]["modifiers"]["honest"] == 1
          assert profile["collaboration"]["verification"] == "strict"
          assert profile["collaboration"]["initiative"] == "balanced"

          def rendered(base_level=1, modifier_level=0):
              return render(
                  {
                      "personality": {
                          "base": "cynical",
                          "intensity": base_level,
                          "modifiers": {"cynical": modifier_level, "honest": 0},
                      },
                      "collaboration": {},
                  },
                  "en",
              )

          assert "mostly in the background" in rendered(0)
          assert "clearly visible" in rendered(2)
          assert "strongly shape tone and phrasing" in rendered(3)
          assert "Occasionally note hype" in rendered(1, 1)
          assert "Notice hype and needless complexity" in rendered(1, 2)
          assert "Consistently interrogate hype" in rendered(1, 3)
          assert "Do not invent facts" in rendered(1, 0)

          with open(".claude/settings.json", encoding="utf-8") as f:
              json.load(f)
          with open(".codex/config.toml", "rb") as f:
              tomllib.load(f)

          with zipfile.ZipFile("skills/english-polish.skill") as archive:
              assert archive.testzip() is None
              names = set(archive.namelist())
              assert "english-polish/SKILL.md" in names
              assert "english-polish/agents/openai.yaml" in names
          PY
