name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Compile Python sources
        run: |
          python -m compileall -q tools tests
          python -m py_compile templates/openai-agent.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test renderer entrypoints
        run: |
          python tools/render_profile.py \
            profiles/default.yaml \
            examples/profile.overlay.yaml \
            --schema schema/style-profile.schema.json \
            --output /tmp/instructions.txt
          python -m tools.render_profile \
            profiles/default.yaml \
            examples/profile.overlay.yaml \
            --schema schema/style-profile.schema.json \
            --output /tmp/instructions-module.txt
          cmp /tmp/instructions.txt /tmp/instructions-module.txt
          grep -q "Odpowiadaj w języku użytkownika" /tmp/instructions.txt
          grep -q "Najpierw podaj odpowiedź" /tmp/instructions.txt
          grep -q "pełnej walidacji" /tmp/instructions.txt

          printf 'personality:\n' > /tmp/bad-overlay.yaml
          if python tools/render_profile.py profiles/default.yaml /tmp/bad-overlay.yaml >/tmp/bad.out 2>/tmp/bad.err; then
            echo "expected null personality overlay to fail" >&2
            exit 1
          fi
          grep -q "personality.*must be a mapping" /tmp/bad.err
